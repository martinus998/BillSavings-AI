name: Deploy BillSavings AI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build public artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site

          # Deploy every public root HTML/JS/CSS/TXT asset so newly added pages and
          # verification files such as IndexNow keys are never omitted.
          for f in *.html *.css *.js *.svg *.txt *.xml robots.txt; do
            if [ -f "$f" ]; then cp "$f" _site/; fi
          done

          # Keep critical mobile assets versioned to avoid stale browser copies.
          if grep -q 'mobile-critical.css' _site/index.html; then
            true
          else
            sed -i 's#</head>#<link rel="stylesheet" href="mobile-critical.css?v=20260916-1505"></head>#' _site/index.html
          fi
          sed -i 's#src="analytics.js"#src="analytics.js?v=20260916-1505"#' _site/index.html

          # Only the legacy GitHub Pages address redirects; production .com is unchanged.
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          redirect = """<script>
          if (window.location.hostname === "martinus998.github.io" &&
              window.location.pathname.startsWith("/BillSavings-AI/")) {
            window.location.replace("https://billsavingsai.com/" +
              window.location.pathname.slice("/BillSavings-AI/".length) +
              window.location.search + window.location.hash);
          }
          </script>"""

          # Indexable sitemap pages get full GA4 analytics. analytics.js also loads
          # the first-party live tracker, so one script covers both measurements.
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          indexed_pages = {"index.html"}
          for sitemap in ("sitemap.xml", "sitemap-growth.xml"):
              root = ET.parse(sitemap).getroot()
              for node in root.findall("sm:url/sm:loc", ns):
                  if not node.text:
                      continue
                  path = node.text.strip().split("billsavingsai.com/", 1)[-1].split("?", 1)[0].split("#", 1)[0]
                  indexed_pages.add(path or "index.html")

          for page in Path("_site").glob("*.html"):
              html = page.read_text(encoding="utf-8")

              if (page.name in indexed_pages
                      and page.name != "live-dashboard.html"
                      and "analytics.js" not in html):
                  analytics = '<script src="/analytics.js?v=20260921-allpages1" defer></script>'
                  if "</head>" in html:
                      html = html.replace("</head>", analytics + "</head>", 1)
                  elif "<body" in html:
                      html = html.replace("<body", analytics + "<body", 1)

              # Non-indexed public pages still remain visible in the private live dashboard.
              if (page.name != "live-dashboard.html"
                      and "analytics.js" not in html
                      and "live-tracker.js" not in html):
                  tracker = '<script src="/live-tracker.js?v=20260921-allpages1" defer></script>'
                  if "</head>" in html:
                      html = html.replace("</head>", tracker + "</head>", 1)
                  elif "<body" in html:
                      html = html.replace("<body", tracker + "<body", 1)

              if "<head>" in html:
                  html = html.replace("<head>", "<head>" + redirect, 1)

              page.write_text(html, encoding="utf-8")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
