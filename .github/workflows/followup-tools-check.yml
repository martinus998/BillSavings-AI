name: Followup Tools Check
on:
  push:
    branches: [main, feature/savings-follow-up-20260921]
    paths: [savings-follow-up.html, decision-followup-v1.js, decision-followup-v1.css, sitemap-growth.xml, tests/followup-tools.test.cjs, .github/workflows/followup-tools-check.yml]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  followup-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate arithmetic, unknown states, imports and private calendar export
        run: node tests/followup-tools.test.cjs
